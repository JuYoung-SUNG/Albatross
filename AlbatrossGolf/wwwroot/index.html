<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Albatross KBO - 한국 프로야구 경기결과, 선수 기록, 팀 순위를 한눈에" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Albatross Golf — 골프 연습장 정보</title>
    <base href="/" />
    <script>
        (function () {
            var saved = localStorage.getItem('albatross-theme');
            var theme = ['white', 'blue', 'yellow', 'green'].indexOf(saved) >= 0 ? saved : 'white';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link href="css/app.css?v=202607052" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:var(--bg-primary);color:var(--text-primary);font-family:sans-serif;">
        <svg width="50" height="50" viewBox="0 0 50 50" style="margin-bottom:1rem;animation:spin 1s linear infinite;">
          <circle cx="25" cy="25" r="20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="80 40"/>
        </svg>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
        <p>Albatross 로딩 중...</p>
      </div>
    </div>
    <script src="js/chart.umd.min.js"></script>
    <script src="js/hammer.min.js"></script>
    <script src="js/chartjs-plugin-zoom.min.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/theme.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        console.log("[1단계] index.html - 브라우저가 최상위 뼈대 HTML을 읽었습니다. 곧 Blazor C# 엔진을 시동합니다.");
    </script>

</html>
