name: Deploy to Cloudflare Pages

# 데이터 수집(collector)은 로컬 예약 작업에서 돌리고, 여기서는 배포만 담당한다.
# KBO·건강·골프 사이트는 각각 별도 저장소로 분리되어 그곳에서 배포한다. 여기서는 포털만 배포한다.
#  - 포털(대문) : Albatross.Web      → secrets.CLOUDFLARE_PROJECT_NAME
# 변경된 사이트만 배포되도록 경로 필터를 사용한다.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      portal: ${{ steps.filter.outputs.portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            portal:
              - 'Albatross.Web/**'
              - 'Albatross.Shared/**'

  deploy-portal:
    needs: changes
    if: needs.changes.outputs.portal == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish portal
        run: dotnet publish Albatross.Web/Albatross.Web.csproj --configuration Release
      - name: Deploy portal
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy Albatross.Web/bin/Release/net10.0/publish/wwwroot --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}



