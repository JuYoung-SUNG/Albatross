name: News Collector and Cloudflare Pages Deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: news-updater-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  COLLECTOR_DATA_DIR: Albatross.Web/wwwroot/data
  COLLECTOR_DB_PATH: Albatross.Web/wwwroot/data/albatross-news.db
  PUBLISH_DIR: Albatross.Web/bin/Release/net10.0/publish/wwwroot

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore Albatross.Collector/Albatross.Collector.csproj
          dotnet restore Albatross.Web/Albatross.Web.csproj

      - name: Run collector
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          Collector__DataDirectory: ${{ env.COLLECTOR_DATA_DIR }}
          Collector__DatabasePath: ${{ env.COLLECTOR_DB_PATH }}
        run: dotnet run --no-restore --configuration Release --project Albatross.Collector/Albatross.Collector.csproj -- --once

      - name: Commit collector outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Albatross.Web/wwwroot/data/news.json
          git add -f Albatross.Web/wwwroot/data/albatross-news.db
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update news data"
            git push
          else
            echo "No collector output changes to commit."
          fi

      - name: Publish Blazor WebAssembly
        run: dotnet publish Albatross.Web/Albatross.Web.csproj --configuration Release --no-restore

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.PUBLISH_DIR }} --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
